<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Swarm</title>
<style>
  :root {
    --bg: #07090d; --fg: #e8eef5; --muted: #8893a3; --line: #ffffff2e;
    --light-bg: #f2efe8; --light-fg: #121418;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: none;                                      /* the hive is the cursor */
  }
  section { position: relative; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 40px; padding: 48px 16px; }

  .title {
    --swarm-color: #ffd36e;
    margin: 0; text-align: center; text-transform: uppercase;
    font-size: clamp(64px, 16vw, 200px); font-weight: 900; letter-spacing: 0.02em; line-height: 1;
    color: var(--fg);
    text-shadow: 0 0 calc(var(--swarm, 0) * 26px) color-mix(in oklab, var(--swarm-color) calc(var(--swarm, 0) * 65%), transparent);
  }
  .lede { margin: -16px 0 0; color: var(--muted); max-width: 46ch; text-align: center; }

  /* Invisible on purpose: no colour, no glow CSS. Only the swarm shows it. */
  .logo {
    --swarm-color: #ffd36e;
    margin: 0; color: transparent; text-shadow: none; user-select: none;
    font-size: clamp(56px, 12vw, 120px); font-weight: 900; letter-spacing: 0.08em; line-height: 1;
  }
  /* Invisible button: the swarm draws an Easter egg around it; each click changes the design. */
  .egg {
    position: absolute; right: clamp(100px, 14vw, 240px); bottom: 130px; width: 60px; height: 80px;
    padding: 0; border: 0; background: none; color: transparent; cursor: none;
  }
  .egg:focus-visible { outline: 1px dashed #ffffff40; outline-offset: 4px; }

  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px; }
  .btn {
    --swarm-color: #7cf7ff;
    font: 600 18px/1 inherit; font-family: inherit; letter-spacing: 0.04em;
    padding: 20px 40px; border-radius: 999px; background: transparent; cursor: none;
    color: var(--fg);
    border: 1.5px solid transparent;                   /* the particles are the moving border */
    box-shadow: 0 0 calc(var(--swarm, 0) * 22px) color-mix(in oklab, var(--swarm-color) calc(var(--swarm, 0) * 45%), transparent);
    text-shadow: 0 0 calc(var(--swarm, 0) * 14px) color-mix(in oklab, var(--swarm-color) calc(var(--swarm, 0) * 60%), transparent);
  }
  .btn.alt { --swarm-color: #ff6ec7; border-radius: 10px; }
  /* Button types: each keeps the transparent border; only the shape and size change. */
  .btn.sharp { --swarm-color: #b5ff6e; border-radius: 0; }
  .btn.round { --swarm-color: #ffb36e; border-radius: 16px; }
  .btn.icon { --swarm-color: #c9a6ff; width: 64px; height: 64px; padding: 0; border-radius: 50%; font-size: 24px; }
  .btn.link { --swarm-color: #6effc0; padding: 8px 6px; border-radius: 6px; font-weight: 500; text-decoration: underline; text-underline-offset: 5px; }
  .btn.cta { --swarm-color: #ff6e6e; padding: 28px 72px; border-radius: 22px; font-size: 24px; font-weight: 700; }
  .types { align-items: center; max-width: 760px; }

  .light { background: var(--light-bg); color: var(--light-fg); }
  .light .title { --fg: var(--light-fg); --swarm-color: #3a5bff; font-size: clamp(48px, 11vw, 140px); }
  .light .lede { color: #5a606b; }
  .light .btn { --fg: var(--light-fg); --swarm-color: #3a5bff; }

  .controls {
    position: fixed; z-index: 10000; left: 50%; bottom: 16px; translate: -50% 0;
    display: flex; gap: 6px; padding: 6px; border-radius: 999px;
    background: #0d1118e6; border: 1px solid var(--line); backdrop-filter: blur(8px);
  }
  .controls button, .controls select {
    font: 500 13px/1 inherit; font-family: inherit; color: var(--fg); background: transparent;
    border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer;
  }
  .controls button[aria-pressed="true"] { background: #ffffff1f; }
  .controls select { background: #ffffff0f; }
  .controls input[type=color] { width: 34px; height: 30px; padding: 0; border: 0; border-radius: 999px; background: transparent; cursor: pointer; }

  .controls, .tune { cursor: auto; }                 /* settings keep a normal pointer */
  .tune {
    position: fixed; z-index: 10001; left: 50%; bottom: 70px; translate: -50% 0;
    width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 100px); overflow: auto;
    padding: 12px 14px; border-radius: 16px; background: #0d1118f2; border: 1px solid var(--line);
    backdrop-filter: blur(8px); color: var(--fg); font-size: 13px; touch-action: pan-y;
  }
  .tune[hidden] { display: none; }
  .tune label { display: grid; grid-template-columns: 7.5em 1fr 3.5em; align-items: center; gap: 8px; padding: 5px 0; }
  .tune output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tune input[type=range] { width: 100%; min-width: 0; accent-color: #7cf7ff; }
</style>
</head>
<body>
  <section>
    <h1 class="title" data-swarm="text" data-swarm-magnet="0.04">Swarm</h1>
    <p class="logo" data-swarm="text" data-swarm-magnet="0" data-swarm-scout="off">DNP</p>
    <p class="lede">Move the cursor. The swarm follows it. Go near the word or a button: the closer you get, the more of the swarm leaves the hive and runs along the letter outlines or the button border.</p>
    <div class="row">
      <button class="btn" data-swarm="border" data-swarm-magnet="0.22">Get started</button>
      <button class="btn alt" data-swarm="border" data-swarm-magnet="0.22">Read more</button>
    </div>
    <div class="row types">
      <button class="btn sharp" data-swarm="border" data-swarm-magnet="0.22">Sharp</button>
      <button class="btn round" data-swarm="border" data-swarm-magnet="0.22">Rounded</button>
      <button class="btn icon" data-swarm="border" data-swarm-magnet="0.3" aria-label="Play">&#9654;</button>
      <button class="btn icon" data-swarm="border" data-swarm-magnet="0.3" aria-label="Add">+</button>
      <button class="btn link" data-swarm="border" data-swarm-magnet="0.15">Text link</button>
      <button class="btn cta" data-swarm="border" data-swarm-magnet="0.18">Start now</button>
    </div>
    <button class="egg" data-swarm="shape" data-swarm-shape="egg" data-swarm-magnet="0" data-swarm-scout="off" aria-label="Easter egg"></button>
  </section>

  <section class="light">
    <h2 class="title" data-swarm="text" data-swarm-magnet="0.04">Contrast</h2>
    <p class="lede">Switch to Contrast mode. The swarm inverts every pixel it crosses, dark or light.</p>
    <div class="row">
      <button class="btn" data-swarm="border" data-swarm-magnet="0.22">Subscribe</button>
    </div>
  </section>

  <div class="controls" role="group" aria-label="Swarm settings">
    <button type="button" data-mode="glow" aria-pressed="true">Glow</button>
    <button type="button" data-mode="contrast" aria-pressed="false">Contrast</button>
    <select aria-label="Particle count">
      <option value="300">300</option>
      <option value="700" selected>700</option>
      <option value="1200">1200</option>
    </select>
    <select aria-label="Text path">
      <option value="border" selected>Border</option>
      <option value="offset">Offset</option>
      <option value="shadow">Shadow</option>
    </select>
    <input type="color" value="#ffd36e" aria-label="Swarm colour">
    <button type="button" id="tune-btn" aria-expanded="false" aria-controls="tune">Tune</button>
  </div>
  <div class="tune" id="tune" role="group" aria-label="Tune the swarm" hidden></div>

  <script src="swarm.js"></script>
  <script>
    const swarm = createSwarm({ count: 700 });
    const modeBtns = document.querySelectorAll('[data-mode]');
    modeBtns.forEach(b => b.addEventListener('click', () => {
      swarm.setMode(b.dataset.mode);
      modeBtns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    }));
    const countSel = document.querySelector('.controls select');
    countSel.addEventListener('change', e => { swarm.setCount(+e.target.value); sliders.count.sync(+e.target.value); });
    document.querySelector('[aria-label="Text path"]').addEventListener('change', e => swarm.setPath(e.target.value));
    document.querySelector('.controls input[type=color]').addEventListener('input', e => swarm.setColor(e.target.value));

    // Tune panel: [option, label, min, max, step]. Defaults come from the swarm itself.
    const TUNE = [
      ['count', 'Count', 100, 2000, 50], ['spacing', 'Hive radius', 8, 80, 1], ['size', 'Size', 0.3, 3, 0.1],
      ['orbit', 'Orbit speed', 0, 4, 0.1], ['stiffness', 'Stiffness', 0.2, 3, 0.1], ['scouts', 'Scout ratio', 0, 0.5, 0.01],
      ['field', 'Pull radius', 20, 300, 5], ['pathSpeed', 'Path speed', 10, 400, 5], ['curve', 'Share curve', 0.5, 4, 0.1],
      ['glow', 'Glow', 0, 3, 0.1],
    ];
    const tune = document.getElementById('tune'), cur = swarm.get(), sliders = {};
    TUNE.forEach(([key, label, min, max, step]) => {
      const l = document.createElement('label');
      l.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}"><output></output>`;
      const input = l.children[1], out = l.children[2];
      const sync = v => { input.value = v; out.textContent = +(+v).toFixed(2); };
      input.addEventListener('input', () => {
        swarm.set({ [key]: +input.value }); sync(input.value);
        if (key === 'count') countSel.value = input.value;       // blank when it matches no option
      });
      sync(cur[key]);
      sliders[key] = { sync };
      tune.appendChild(l);
    });
    const tuneBtn = document.getElementById('tune-btn');
    tuneBtn.addEventListener('click', () => {
      tune.hidden = !tune.hidden;
      tuneBtn.setAttribute('aria-expanded', String(!tune.hidden));
      tuneBtn.setAttribute('aria-pressed', String(!tune.hidden));
    });
  </script>
</body>
</html>
